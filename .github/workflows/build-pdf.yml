name: Build PDF

on:
  push:
    branches: [main]
    paths:
      - "weeks/**"
      - "book/**"
      - "LEARNING_PATH*"
      - "scripts/**"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system libs
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # fonts-noto-cjk from the Azure apt mirror stalls; fonts are fetched below.
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null 2>&1 || true
          sudo rm -f /var/lib/man-db/auto-update
          printf 'Acquire::http::Timeout "30";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99timeout >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fontconfig
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install weasyprint markdown fonttools
      - name: Install Noto Sans SC
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /tmp/NotoSansSC-VF.ttf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/Variable/TTF/Subset/NotoSansSC-VF.ttf
          python - << 'PY'
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          src = "/tmp/NotoSansSC-VF.ttf"
          for wght, dest in ((400, "/tmp/NotoSansSC-Regular.ttf"), (700, "/tmp/NotoSansSC-Bold.ttf")):
              font = TTFont(src)
              instantiateVariableFont(font, {"wght": wght}, inplace=True, updateFontNames=True)
              font.save(dest)
              print("wrote", dest)
          PY
          mkdir -p "$HOME/.local/share/fonts/noto"
          cp /tmp/NotoSansSC-Regular.ttf /tmp/NotoSansSC-Bold.ttf "$HOME/.local/share/fonts/noto/"
          fc-cache -f
          fc-list "Noto Sans SC" family style | grep -q "Noto Sans SC"
      - name: Build PDFs
        run: bash scripts/build_pdf.sh dist
      - name: Publish to rolling release pdf-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="自动生成的最新 PDF（${GITHUB_SHA::7}，$(date -u +%Y-%m-%d)）。Auto-built latest PDFs. Unofficial notes, CC BY-NC-SA 4.0."
          if ! gh release view pdf-latest >/dev/null 2>&1; then
            gh release create pdf-latest --title "PDF（最新 / latest）" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release edit pdf-latest --notes "$NOTES"
          fi
          gh release upload pdf-latest dist/CS146S-book-zh.pdf dist/CS146S-book-en.pdf dist/CS146S-notes-zh.pdf dist/CS146S-notes-en.pdf --clobber
